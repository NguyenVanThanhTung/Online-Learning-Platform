<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnHub Test Runner</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      body {
        padding: 2rem 0;
        background: #f8f9fa;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h3 mb-3">Test Runner</h1>
          <div id="test-summary" class="alert alert-info mb-3">Loading browser tests...</div>
          <div id="test-results" class="small text-muted"></div>
        </div>
      </div>
    </main>

    <script>
      window.testRunner = {
        total: 0,
        passed: 0,
        failed: 0,
        results: [],
        registerSuite: function registerSuite(name, testFn) {
          const suiteResult = { name, passed: 0, failed: 0, details: [] };
          if (typeof testFn === 'function') {
            testFn({
              ok: function ok(condition, message) {
                const detail = { message, status: condition ? 'pass' : 'fail' };
                suiteResult.details.push(detail);
                suiteResult[condition ? 'passed' : 'failed'] += 1;
              },
              equal: function equal(actual, expected, message) {
                const condition = actual === expected;
                const detail = { message, status: condition ? 'pass' : 'fail' };
                suiteResult.details.push(detail);
                suiteResult[condition ? 'passed' : 'failed'] += 1;
              },
            });
          }
          window.testRunner.results.push(suiteResult);
        },
      };

      function loadScript(src) {
        return new Promise(function onLoad(resolve, reject) {
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = function onError() {
            reject(new Error('Failed to load ' + src));
          };
          document.head.appendChild(script);
        });
      }

      const testFiles = [
        'course-service.test.js',
        'lesson-service.test.js',
        'quiz-service.test.js',
        'storage-service.test.js',
        'validator.test.js',
      ];

      Promise.allSettled(testFiles.map(function mapFiles(file) {
        return loadScript(file);
      })).then(function onLoaded() {
        const summary = document.getElementById('test-summary');
        const output = document.getElementById('test-results');
        const suites = window.testRunner.results || [];
        const totalPassed = suites.reduce(function reducePassed(accumulator, current) {
          return accumulator + current.passed;
        }, 0);
        const totalFailed = suites.reduce(function reduceFailed(accumulator, current) {
          return accumulator + current.failed;
        }, 0);

        summary.className = 'alert ' + (totalFailed === 0 ? 'alert-success' : 'alert-warning') + ' mb-3';
        summary.textContent = 'Completed: ' + totalPassed + ' passed, ' + totalFailed + ' failed across ' + suites.length + ' suites.';

        if (suites.length === 0) {
          output.textContent = 'No browser test suites were registered by the current test files.';
          return;
        }

        output.innerHTML = suites.map(function mapSuite(suite) {
          return '<div class="mb-2"><strong>' + suite.name + '</strong><br />' + suite.details.map(function mapDetail(detail) {
            return '<span class="text-' + (detail.status === 'pass' ? 'success' : 'danger') + '">[' + detail.status.toUpperCase() + '] ' + detail.message + '</span><br />';
          }).join('') + '</div>';
        }).join('');
      }).catch(function onError(error) {
        const summary = document.getElementById('test-summary');
        const output = document.getElementById('test-results');
        summary.className = 'alert alert-danger mb-3';
        summary.textContent = 'Runner failed to load the browser test files.';
        output.textContent = error.message;
      });
    </script>
  </body>
</html>
