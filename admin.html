<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnHub - Admin Panel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body data-page="admin" data-controller="admin-page" class="page-shell">
    <header class="site-header">
      <nav class="navbar navbar-expand-lg navbar-light" id="site-navbar">
        <div class="container">
          <a class="navbar-brand" href="index.html">LearnHub Admin</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#primary-nav">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="primary-nav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="admin.html">Dashboard</a></li>
              <li class="nav-item"><a class="nav-link" href="index.html">Site</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="site-main" id="main-content">
      <div class="container">
        <div class="row g-4">
          <aside class="col-lg-3" id="admin-sidebar" data-controller="admin-sidebar">
            <div class="page-card p-3">
              <h1 class="h4">Admin Panel</h1>
              <div class="list-group mt-3">
                <a class="list-group-item list-group-item-action active" href="#">Courses</a>
                <a class="list-group-item list-group-item-action" href="#">Instructors</a>
                <a class="list-group-item list-group-item-action" href="#">Reports</a>
              </div>
            </div>
          </aside>

          <section class="col-lg-9" id="admin-content" data-controller="admin-content">
            <div class="page-card p-4">
              <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
                <h2 class="h4 mb-0">Course Management</h2>
                <button id="add-course-button" class="btn btn-primary" type="button">Add New Course</button>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <input id="admin-search" class="form-control" type="search" placeholder="Search courses" data-admin-search />
                </div>
                <div class="col-md-3">
                  <select id="admin-category-filter" class="form-select" data-admin-category>
                    <option value="all">All categories</option>
                    <option value="web-dev">Web Dev</option>
                    <option value="design">Design</option>
                    <option value="data-science">Data Science</option>
                    <option value="marketing">Marketing</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <select id="admin-status-filter" class="form-select" data-admin-status>
                    <option value="all">All statuses</option>
                    <option value="published">Published</option>
                    <option value="draft">Draft</option>
                  </select>
                </div>
              </div>
              <div id="admin-course-table" class="table-responsive" data-admin-table></div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="row g-4">
          <div class="col-md-4">
            <h5>About LearnHub</h5>
            <p class="mb-0">Responsive online learning content and structured course discovery.</p>
          </div>
          <div class="col-md-4">
            <h5>Quick Links</h5>
            <ul class="list-unstyled mb-0">
              <li><a class="text-decoration-none text-light" href="index.html">Courses</a></li>
              <li><a class="text-decoration-none text-light" href="course-detail.html">Details</a></li>
              <li><a class="text-decoration-none text-light" href="admin.html">Admin</a></li>
            </ul>
          </div>
          <div class="col-md-4">
            <h5>Contact</h5>
            <p class="mb-0">support@learnhub.local</p>
          </div>
        </div>
        <p class="text-center mt-4 mb-0">© 2026 LearnHub</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
    <script src="js/controllers/admin-controller.js"></script>
    <script src="js/pages/admin.js"></script>
  </body>
</html>
